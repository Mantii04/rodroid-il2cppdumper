name: Build Android APK (arm64)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"

    - name: Install frontend dependencies
    - name: Sync Tauri API Version
      run: pnpm add @tauri-apps/api@2.10.3
      run: pnpm install

    - name: Initialize Tauri Android
      run: pnpm tauri android init

    - name: Patch AndroidManifest for Android 14 Storage
      run: |
        MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
        sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>\n<application android:requestLegacyExternalStorage="true" android:preserveLegacyExternalStorage="true"/' $MANIFEST

    - name: Build arm64 APK
      run: pnpm tauri android build --target aarch64
      env:
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rodroid-il2cppdumper-arm64
        path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
